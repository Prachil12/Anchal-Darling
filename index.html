<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Anchal ❤️</title>

<!-- Google Fonts for beautiful cursive -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Pacifico', cursive;
}

/* Container */
.container {
    text-align: center;
    z-index: 5;
}

/* Typewriter text */
h1 {
    color: white;
    font-size: 2.8rem;
    min-height: 90px;
}

/* Buttons */
button {
    font-size: 1.4rem;
    padding: 15px 40px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.2s ease;
}

#yesBtn {
    background: #4CAF50;
    color: white;
    margin-right: 20px;
}

#yesBtn:hover {
    transform: scale(1.3);
}

#noBtn {
    background: #f44336;
    color: white;
    position: absolute;
    animation: shake 0.4s infinite;
}

/* NO button shake */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
}

/* Floating hearts */
.heart, .butterfly {
    position: absolute;
    font-size: 20px;
    animation: floatUp linear forwards;
}

.heart { color: pink; }
.butterfly { color: #ff69b4; }

@keyframes floatUp {
    from { transform: translateY(100vh) scale(1); opacity: 1; }
    to { transform: translateY(-10vh) scale(1.6); opacity: 0; }
}

/* Firework hearts */
.burst {
    position: absolute;
    font-size: 26px;
    animation: burst 1.5s ease-out forwards;
}

@keyframes burst {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(2.5); opacity: 0; }
}

/* Heart & butterfly floating z-index fix */
.heart, .butterfly { z-index: 2; }
</style>
</head>

<body>

<!-- 🎶 Music -->
<audio id="bgMusic" loop>
    <source src="hum-tum-kitne-paas-hain.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1 id="text"></h1>
    <button id="yesBtn">YES 💕</button>
    <button id="noBtn">NO 😜</button>
</div>

const message = "💖 Will you be my Valentine, Anchal? 💖";
let i = 0;
const textEl = document.getElementById("text");

function typeText() {
    if (i < message.length) {
        textEl.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeText, 70);
    }
}
typeText();

const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", () => {
    noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
});

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 250);
